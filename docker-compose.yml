services:

  frontend:
    build:
      context: ./frontend
    container_name: devops-frontend
    ports:
      - "3000:80"
  backend:
    build:
      context: ./backend
    container_name: devops-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: devopsdb
      DB_USER: devopsuser
      DB_PASSWORD: devopspassword
    depends_on:
      - postgres

  postgres:
    image: postgres:18
    container_name: devops-postgres
    environment:
      POSTGRES_DB: devopsdb
      POSTGRES_USER: devopsuser
      POSTGRES_PASSWORD: devopspassword
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  postgres-data: